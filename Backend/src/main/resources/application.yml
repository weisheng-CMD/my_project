  port: 8080

spring:
  application:
    name: smart-ticket-system

  # ==================== 数据库 ====================
  datasource:
    url: jdbc:mysql://38.76.207.21:3306/my_project?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: my_project
    password: ixcrDaYsyE5Hc6bh
